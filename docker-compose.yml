services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: inboxintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inboxintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3217}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/inboxintel?schema=public}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3217}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3217/oauth2callback}
    ports:
      - "${PORT:-3217}:${PORT:-3217}"
    volumes:
      - ./logs:/app/logs
      - ./tokens:/app/tokens
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3217}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/inboxintel?schema=public}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3217}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3217/oauth2callback}
    volumes:
      - ./logs:/app/logs
      - ./tokens:/app/tokens
    command: sh -c "npx prisma migrate deploy && node dist/jobs/ingestGmail.js --loop"

volumes:
  postgres-data:
