services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: inboxintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inboxintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/inboxintel?schema=public}
    ports:
      - "${PORT:-3217}:${PORT:-3217}"
    volumes:
      - .:/app
      - /app/node_modules
      - ./tokens:/app/tokens
    command: sh -c "npm install && npx prisma generate && npm run prisma:migrate && npm run dev"

volumes:
  postgres-data:
